
[project]
name = 'uk_weather_service'
version = '0.1.2'
description = 'UK Weather Services'
requires-python = '>=3.12'
readme = 'README.md'
dependencies = [
    'requests~=2.32',
    'fastapi[standard]~=0.161.0'
]

[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ['tests']