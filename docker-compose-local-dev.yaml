
services:
  api_server:
    container_name: api_server
    image: uk_weather_services:local-dev
    build:
      context: .
      dockerfile: Dockerfile-local-dev
    ports:
      - "10080:8080"
    environment:
      MET_OFFICE_ATOMSPHERIC_API_KEY: '<Fill Your API Key'
      MET_OFFICE_MAP_IMAGE_API_KEY: '<Fill Your API Key'
      MET_OFFICE_OBSERVATION_API_KEY: '<Fill Your API Key'
      MET_OFFICE_SITE_SPECIFIC_GLOBAL_SPOT_DATA_API_KEY: '<Fill Your API Key'
      MET_OFFICE_WARNING_API_KEY: '<Fill Your API Key'

